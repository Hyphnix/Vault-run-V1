{brief:[['ROOK',"The Meridian Key. Don't ask what it opens."],['PIP',"Lasers. The blinking ones cycle, and a dash slips through them. Locked grids need a terminal: stand at a console, press F, win the hack."],['PIP',"The museum vault opens from a terminal, not a card."]],

/* ---------- level features ---------- */
const DEF={vault:0,doorTerm:0,lasers:0,locked:0,cams:0,terms:0,order:0,hunters:0,core:0,code:0,extra:0,lootMul:1,timeMul:1,darkAdd:0,lightR:165};
const MODS=[
{id:'blackout',n:'BLACKOUT',d:'Lights are out. Your vision is tiny.'},
{id:'gold',n:'GOLD RUSH',d:'Loot worth +60%, but 15% less time.'},
{id:'swarm',n:'SWARM',d:'Three extra drones on patrol.'},
{id:'grid',n:'LASER GRID',d:'Many more laser barriers.'},
{id:'hunted',n:'HUNTED',d:'Two extra hunter drones.'},
{id:'vaultcode',n:'COMBINATION LOCK',d:'The vault needs a 3-digit code.'},
{id:'rush',n:'SPEED RUN',d:'25% less time, +30% loot.'}];
function modsFor(n){
  if(n<=8)return [];
  const k=n-9,out=[MODS[(k*3+1)%MODS.length]];
  if(k>=5){const m=MODS[(k*5+3)%MODS.length];if(!out.includes(m))out.push(m);}
  if(k>=12){const m=MODS[(k*2+5)%MODS.length];if(!out.includes(m))out.push(m);}
  return out;
}
const FEATS={
 1:{},
 2:{vault:1},
 3:{vault:1,doorTerm:1,lasers:3,locked:1,cams:2},
 4:{terms:2,cams:2,lasers:2,hunters:1},
 5:{vault:1,terms:3,order:1,lasers:3,cams:3,hunters:1},
 6:{vault:1,code:1,terms:3,lasers:3,locked:2,cams:3,hunters:1},

 8:{vault:1,terms:1,core:1,lasers:4,locked:2,cams:4,hunters:2}
};
function featFor(n){
  let f;
  if(n<=8)f=Object.assign({},DEF,FEATS[n]);
  else{
    f=Object.assign({},DEF,FEATS[5+((n-9)%4)]);
    f.core=0;f.hunters=Math.min(2+Math.floor((n-9)/3),4);f.cams=Math.min(f.cams+1+Math.floor((n-9)/4),6);f.lasers=Math.min(f.lasers+Math.floor((n-8)/3),7);
  }
  f.mods=modsFor(n);
  for(const m of f.mods){
    switch(m.id){
      case 'blackout':f.darkAdd=.22;f.lightR=105;break;
      case 'gold':f.lootMul*=1.6;f.timeMul*=.85;break;
      case 'swarm':f.extra+=3;break;
      case 'grid':f.lasers=Math.min(f.lasers+4,9);break;
      case 'hunted':f.hunters+=2;break;
      case 'vaultcode':f.code=1;break;
      case 'rush':f.timeMul*=.75;f.lootMul*=1.3;break;
    }
  }
  if(f.code){f.vault=1;f.doorTerm=0;}
  return f;
}

/* ---------- audio ---------- */
let AC=null,master,musF,mus,sfxG,noiseBuf,muted=false,nextT=0,stepI=0,mInt=0;
function ainit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.7;master.connect(AC.destination);
    musF=AC.createBiquadFilter();musF.type='lowpass';musF.frequency.value=2200;musF.connect(master);
    mus=AC.createGain();mus.gain.value=.55;mus.connect(musF);
    sfxG=AC.createGain();sfxG.gain.value=.8;sfxG.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,t,dur,type,vol,dest,f2){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.05);
}
function nz(t,dur,vol,hp,dest){
  if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||2000;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t);s.stop(t+dur+.02);
}
function sfx(n){
  if(!AC||muted)return;const t=AC.currentTime;
  switch(n){
    case 'coin':tone(880,t,.08,'square',.12);tone(1320,t+.06,.1,'square',.12);break;
    case 'gem':[1046,1318,1568,2093].forEach((f,i)=>tone(f,t+i*.05,.12,'triangle',.16));break;
    case 'jack':[523,659,784,1046,1318,1568,2093].forEach((f,i)=>tone(f,t+i*.06,.2,'square',.12));break;
    case 'key':[700,900,1400].forEach((f,i)=>tone(f,t+i*.07,.14,'triangle',.18));break;

function step(i,t){

function bfsPath(sx,sy,tx,ty){

function genLevel(n){

        grid[dr][dc]=2;

    const vr=V?{c:V.rc-1,r:V.rr-1,w:7,h:7}:null;
    const nb=easy?0:12+Math.min(n,12)+ri(0,4);

      const w=ri(2,6),h=ri(1,4),c=ri(2,COLS-2-w),r=ri(2,ROWS-2-h),rc={c,r,w,h};
      if(safe.some(s=>hit(rc,s))||(vr&&hit(rc,vr)))continue;

    }
    for(const s of safe)for(let y=s.r;y<s.r+s.h;y++)for(let x=s.c;x<s.c+s.w;x++)grid[y][x]=0;
    if(V)grid[V.or][V.oc]=0;

    const cands=[];

    for(let c=7;c<=COLS-8;c++){let r=1;while(r<ROWS-1){

function populate(n,th,F,V,kcol,lasers,all,reg2,dm0,inV){

    const mp=pickSpaced(shuffle(reg2.filter(p=>p.c>=7&&p.c<=COLS-4&&!inV(p.c,p.r))),3,6,tcells);

}

      bx.strokeStyle='rgba(60,50,40,.35)';bx.beginPath();bx.moveTo(x+4,y+3);bx.quadraticCurveTo(x+14,y+12,x+8,y+20);bx.stroke();
      if(k<2){bx.fillStyle='#575047';bx.beginPath();bx.arc(x+16,y+10,5,0,7);bx.fill();bx.fillRect(x+12,y+13,8,7);}
      break;
    case 'dots':
      bx.fillStyle='#20103a';bx.fillRect(x,y,T,T);bx.fillStyle='#331a5c';bx.fillRect(x+1,y+1,T-2,T-2-(below?7:0));
      const sc=bx.createLinearGradient(x,y,x,y+16);sc.addColorStop(0,k%2?'#3cf2ff':'#ff3cd8');sc.addColorStop(1,'#1a0c30');
      bx.fillStyle=sc;bx.fillRect(x+5,y+4,T-10,11);
      for(let i=0;i<4;i++){bx.fillStyle=['#ffd24a','#3cf2ff','#ff3cd8','#7dff9a'][(i+k)%4];bx.fillRect(x+6+i*5,y+18,3,3);}
      break;
    case 'grid':
      bx.fillStyle='#142028';bx.fillRect(x,y,T,T);bx.fillStyle='#1f313b';bx.fillRect(x+1,y+1,T-2,T-2-(below?7:0));
      for(let i=0;i<4;i++){bx.fillStyle='rgba(0,0,0,.35)';bx.fillRect(x+3,y+4+i*5,T-6,3);bx.fillStyle=((i+k)%3===0)?'#7dfcff':((i+k)%3===1)?'#3dff8a':'#2a4a58';bx.fillRect(x+T-9,y+5+i*5,3,2);}
      break;
    case 'hex':{
      bx.fillStyle='#0c2016';bx.fillRect(x,y,T,T);
      const tg=bx.createRadialGradient(x+16,y+14,2,x+16,y+14,14);tg.addColorStop(0,'rgba(170,255,140,.9)');tg.addColorStop(1,'rgba(30,120,70,.7)');
      bx.fillStyle=tg;bx.beginPath();bx.arc(x+16,y+14,11,0,7);bx.fill();
      bx.strokeStyle='rgba(200,255,220,.5)';bx.lineWidth=1.5;bx.stroke();bx.lineWidth=1;
      bx.fillStyle='rgba(255,255,255,.5)';bx.beginPath();bx.arc(x+12,y+10+k,1.6,0,7);bx.arc(x+19,y+16-k,1.2,0,7);bx.fill();
      break;}
    case 'circuit':
      bx.fillStyle='#0a1630';bx.fillRect(x,y,T,T);bx.fillStyle='#10244a';bx.fillRect(x+1,y+1,T-2,T-2-(below?7:0));
      bx.strokeStyle='rgba(0,255,208,.55)';bx.beginPath();bx.moveTo(x+4,y+8);bx.lineTo(x+16,y+8);bx.lineTo(x+16,y+20);bx.lineTo(x+28,y+20);bx.stroke();
      bx.fillStyle='#00ffd0';bx.beginPath();bx.arc(x+16,y+8,2.2,0,7);bx.arc(x+28,y+20,2.2,0,7);bx.fill();
      break;
    case 'hazard':
      bx.fillStyle='#352a2c';bx.fillRect(x,y,T,T);bx.fillStyle='#4f4043';bx.fillRect(x+1,y+1,T-2,T-2-(below?7:0));
      bx.save();bx.beginPath();bx.rect(x+3,y+3,T-6,T-6-(below?7:0));bx.clip();bx.strokeStyle='rgba(255,200,40,.5)';bx.lineWidth=5;
      for(let i=-1;i<4;i++){bx.beginPath();bx.moveTo(x+i*10,y+T);bx.lineTo(x+i*10+T,y);bx.stroke();}
      bx.restore();bx.lineWidth=1;
      if(k===0){bx.fillStyle='#ff3a3a';bx.beginPath();bx.arc(x+26,y+7,2.5,0,7);bx.fill();}
      break;
  }
  if(below){
    bx.fillStyle='rgba(0,0,0,.45)';bx.fillRect(x,y+T-7,T,7);
    const g=bx.createLinearGradient(0,y+T,0,y+T+10);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=g;bx.fillRect(x,y+T,T,10);
  }
}
function buildBG(th){
  bx.fillStyle=th.floor;bx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const g=grid[r][c];if(g===1||g===5)continue;
    const x=c*T,y=r*T;
    if((r+c)%2===0){bx.fillStyle=th.floor2;bx.fillRect(x,y,T,T);}
    bx.fillStyle='rgba(255,255,255,.035)';bx.fillRect(x,y,T,1);bx.fillRect(x,y,1,T);
    bx.fillStyle='rgba(0,0,0,.2)';bx.fillRect(x,y+T-1,T,1);bx.fillRect(x+T-1,y,1,T);
    for(let k=0;k<4;k++){bx.fillStyle='rgba(255,255,255,'+rnd(.02,.06)+')';bx.fillRect(x+rnd(2,T-2),y+rnd(2,T-2),1,1);}
    bx.strokeStyle=hexA(th.acc,.07);bx.fillStyle=hexA(th.acc,.08);bx.lineWidth=1;
    switch(th.pat){
      case 'diamond':bx.beginPath();bx.moveTo(x+16,y+6);bx.lineTo(x+26,y+16);bx.lineTo(x+16,y+26);bx.lineTo(x+6,y+16);bx.closePath();bx.stroke();break;
      case 'stripe':bx.beginPath();bx.moveTo(x+8.5,y);bx.lineTo(x+8.5,y+T);bx.moveTo(x+24.5,y);bx.lineTo(x+24.5,y+T);bx.stroke();break;
      case 'dots':bx.beginPath();bx.arc(x+16,y+16,2.5,0,7);bx.fill();break;
      case 'grid':bx.strokeRect(x+.5,y+.5,T-1,T-1);break;
      case 'hex':bx.beginPath();bx.arc(x+16,y+16,10,0,7);bx.stroke();break;
      case 'circuit':{bx.beginPath();if(Math.random()<.5){bx.moveTo(x,y+16);bx.lineTo(x+rnd(8,22),y+16);}else{bx.moveTo(x+16,y);bx.lineTo(x+16,y+rnd(8,22));}bx.stroke();if(Math.random()<.35){bx.beginPath();bx.arc(x+16,y+16,2.5,0,7);bx.fill();}break;}
    }
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const g=grid[r][c],x=c*T,y=r*T;
    if(g===5){drawProp(th,x,y,c,r);continue;}
    if(g!==1)continue;
    bx.fillStyle=th.wall;bx.fillRect(x,y,T,T);
    bx.fillStyle='rgba(255,255,255,.05)';bx.fillRect(x+3,y+3,T-6,T-6);
    bx.strokeStyle='rgba(0,0,0,.25)';bx.beginPath();bx.moveTo(x,y+T/2+.5);bx.lineTo(x+T,y+T/2+.5);bx.moveTo(x+T/2+.5,y);bx.lineTo(x+T/2+.5,y+T/2);bx.stroke();
    if(th.pat==='hazard'){bx.strokeStyle='rgba(255,200,40,.18)';bx.lineWidth=5;for(let k=-1;k<3;k++){bx.beginPath();bx.moveTo(x+k*16,y+T);bx.lineTo(x+k*16+T,y);bx.stroke();}bx.lineWidth=1;}
    if(!isWallT(c,r-1)){bx.fillStyle=th.top;bx.fillRect(x,y,T,4);bx.fillStyle='rgba(255,255,255,.15)';bx.fillRect(x,y,T,1);}
    if(!isWallT(c,r+1)){
      bx.fillStyle='rgba(0,0,0,.4)';bx.fillRect(x,y+T-7,T,7);
      const gr=bx.createLinearGradient(0,y+T,0,y+T+12);gr.addColorStop(0,'rgba(0,0,0,.45)');gr.addColorStop(1,'rgba(0,0,0,0)');
      bx.fillStyle=gr;bx.fillRect(x,y+T,T,12);
    }
  }
  bx.strokeStyle=hexA(th.acc,.25);bx.lineWidth=2;bx.setLineDash([5,5]);bx.strokeRect(SX*T-16,SY*T-16,T*2,T*2);bx.setLineDash([]);
}

/* ---------- game setup ---------- */
function newLevel(n){
  const lv=genLevel(n),D=DF(),F=lv.F,u=save.up;
  buildBG(lv.th);
  P={x:SX*T+T/2,y:SY*T+T/2,r:8,face:0,stam:85+25*u.stam+30*pk('stam'),maxStam:85+25*u.stam+30*pk('stam'),exhaust:false,sprinting:false,loud:false,walk:0,
     dashT:0,dashCd:0,dvx:0,dvy:0,jamCd:0,jams:1+u.jam+pk('jam'),decoys:(n>=2?2+u.decoy:0)+pk('decoy'),decoyCd:0,dashMax:Math.max(1.2,3.5-.4*u.dash-pk('phase'))};
  const tm=(Math.max(34,64-n*2.5)+F.terms*7+(lv.V?6:0)+(lv.code?10:0))*D.time*F.timeMul+4*u.time+8*pk('time');
  G={n,code:lv.code,dark:Math.min(.93,lv.th.dark+F.darkAdd),lightR:F.lightR,mods:F.mods,th:lv.th,F,V:lv.V,kcol:lv.kcol,items:lv.items,drones:lv.drones,doors:lv.doors,lasers:lv.lasers,cams:lv.cams,terms:lv.terms,lamps:lv.lamps,
     story:storyFor(n),said:{},radio:null,keys:{},hack:null,decoys:[],dust:[],
     req:{terms:F.terms,ordered:!!F.order,core:!!F.core},hacked:0,nextNum:1,coreTaken:false,
     score:0,got:0,time:tm,timeMax:tm,lock:false,lockT:0,lockMax:11,detect:0,heat:0,combo:0,comboT:0,
     spotted:false,t:0,introT:2.6,parts:[],floats:[],rings:[],shake:0,flash:0,over:false,bt:0,beepT:0,lastSec:-1,sum:null,why:'',exitMsgT:0};
  for(let i=0;i<45;i++)G.dust.push({x:rnd(0,W),y:rnd(0,H),vx:rnd(-6,6),vy:rnd(-4,4),s:rnd(.8,2)});
  for(const d of G.drones)computePoly(d);
  nextT=0;stepI=0;mInt=0;
}
function startLevel(n){
  ainit();hide();run.level=n;newLevel(n);mode='intro';
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
}

/* ---------- logic ---------- */
const objDone=()=>G.hacked>=G.req.terms&&(!G.req.core||G.coreTaken);
function say(who,txt,dur){if(G)G.radio={who,txt,t:dur||4.4};}
function sayKey(k){
  if(!G||G.said[k])return;
  const line=(G.story.radio&&G.story.radio[k])||GENERIC[k];
  if(line){G.said[k]=1;say(line[0],line[1]);}
}
function computePoly(d){
  const N=22,pts=[[d.x,d.y]],a0=d.ang-d.half,st=2*d.half/N;
  for(let i=0;i<=N;i++){
    const a=a0+i*st,ca=Math.cos(a),sa=Math.sin(a);let r=0;
    for(;r<d.range;r+=5){if(isWall(d.x+ca*(r+5),d.y+sa*(r+5)))break;}
    pts.push([d.x+ca*r,d.y+sa*r]);
  }
  d.poly=pts;
}
function canSee(d){
  const dx=P.x-d.x,dy=P.y-d.y,dist=Math.hypot(dx,dy);
  if(dist>d.range)return false;
  if(dist<26)return los(d.x,d.y,P.x,P.y);
  if(Math.abs(angDiff(Math.atan2(dy,dx),d.ang))>d.half)return false;
  return los(d.x,d.y,P.x,P.y);
}
function follow(d,sp,dt){
  let rem=sp*dt;
  while(rem>0&&d.path.length){
    const t=d.path[0],dx=t.x-d.x,dy=t.y-d.y,dist=Math.hypot(dx,dy);
    if(dist>.5){const ta=Math.atan2(dy,dx);d.ang+=clamp(angDiff(ta,d.ang),-7*dt,7*dt);}
    if(dist<=rem){d.x=t.x;d.y=t.y;rem-=dist;d.path.shift();}
    else{d.x+=dx/dist*rem;d.y+=dy/dist*rem;rem=0;}
  }
  return d.path.length===0;
}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(.3,1)*sp;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.7),max:.7,col,sz:rnd(1.5,3.5)});}}
function floatText(x,y,txt,col){G.floats.push({x,y,txt,life:1.2,col});}
function alarm(x,y,rad,lookMax){
  for(const d of G.drones){
    if(d.stun>0||d.state==='chase')continue;
    if(rad<1e8&&Math.hypot(d.x-x,d.y-y)>rad)continue;
    d.state='investigate';d.tx=x;d.ty=y;d.path=bfsPath(d.x,d.y,x,y);d.look=0;d.lookMax=lookMax||2.4;
  }
}

function updDrone(d,dt){
  const D=DF();
  if(d.stun>0){d.stun-=dt;d.poly=null;d.seen=false;if(d.stun<=0){d.state=G.lock?'chase':'patrol';d.path=[];}return;}
  const mul=(1+G.heat)*D.spd,lk=G.lock?1.3:1;
  d.seen=canSee(d);
  if(d.seen){
    d.lx=P.x;d.ly=P.y;d.lose=0;d.sus+=dt;
    if(d.state!=='chase'&&d.sus>.25){d.state='chase';d.path=[];d.rt=0;if(!G.spotted){G.spotted=true;sayKey('spot');}sfx('spot');alarm(P.x,P.y,320,3);}
  }else d.sus=Math.max(0,d.sus-dt*.8);
  if(d.state==='patrol'&&d.type!=='sentry'&&P.loud&&Math.hypot(P.x-d.x,P.y-d.y)<130){
    d.state='investigate';d.tx=P.x;d.ty=P.y;d.path=bfsPath(d.x,d.y,d.tx,d.ty);d.look=0;d.lookMax=1.6;
  }
  switch(d.state){
    case 'patrol':
      if(d.type==='sentry'){
        if(!d.path.length&&Math.hypot(d.x-d.hx,d.y-d.hy)>4)d.path=bfsPath(d.x,d.y,d.hx,d.hy);
        if(d.path.length)follow(d,d.sp*mul*lk,dt);
        else{const ta=d.base+Math.sin(G.t*1.1+d.ph)*1.15;d.ang+=clamp(angDiff(ta,d.ang),-3*dt,3*dt);}
        break;
      }
      if(d.pause>0){d.pause-=dt;d.ang+=Math.sin(G.t*3+d.ph)*dt*1.4;break;}
      if(!d.path.length){
        const w=d.wp[d.wi];d.wi=(d.wi+1)%d.wp.length;d.path=bfsPath(d.x,d.y,w.x,w.y);
        if(!d.path.length){d.pause=.3;break;}
      }
      if(follow(d,d.sp*mul*lk,dt))d.pause=d.type==='hunter'?rnd(.1,.4):rnd(.4,1.1);
      break;
    case 'investigate':
      if(d.path.length)follow(d,d.sp*1.5*mul*lk,dt);
      else{d.look+=dt;d.ang+=Math.cos(d.look*4)*3*dt;if(d.look>d.lookMax){d.state='patrol';d.path=[];}}
      break;
    case 'chase':{
      d.rt-=dt;
      const track=d.seen||G.lock,tx=track?P.x:d.lx,ty=track?P.y:d.ly;
      if(d.rt<=0){d.path=bfsPath(d.x,d.y,tx,ty);d.rt=.28;}
      follow(d,Math.min(d.csp*mul*lk,250),dt);
      if(d.seen||G.lock){const ta=Math.atan2(P.y-d.y,P.x-d.x);d.ang+=clamp(angDiff(ta,d.ang),-8*dt,8*dt);}
      if(!d.seen&&!G.lock){d.lose+=dt;if(d.lose>d.loseMax){d.state='investigate';d.tx=d.lx;d.ty=d.ly;d.path=[];d.look=0;d.lookMax=2;}}
      if(Math.hypot(P.x-d.x,P.y-d.y)<17)caught('CAUGHT BY A DRONE');
      break;}
  }
  computePoly(d);
}

function startHack(t){
  if(t.eff==='req'&&G.req.ordered&&t.num!==G.nextNum){
    sfx('deny');sayKey('deny');G.detect=Math.min(.95,G.detect+.15);alarm(P.x,P.y,300,2.4);t.cool=1;floatText(t.x,t.y-16,'WRONG ORDER','#ff5a64');return;
  }
  const lim=Math.max(6.5,10-Math.min(G.n,8)*.3);
  if(t.kind==='seq'){
    const len=4+Math.min(Math.floor(G.n/2),3),dirs=['U','D','L','R'],seq=[];
    for(let i=0;i<len;i++)seq.push(dirs[ri(0,3)]);
    G.hack={term:t,kind:'seq',seq,idx:0,t:lim,max:lim,q:[],flash:0};
  }else{
    G.hack={term:t,kind:'sync',pos:0,dir:1,zc:rnd(.25,.75),zw:.24,hits:0,need:3,t:lim,max:lim,q:[],flash:0};
  }
  sfx('ui');
}
function hackDone(){
  const t=G.hack.term;t.done=true;G.hack=null;sfx('ok');burst(t.x,t.y,'#7dfcff',24,160);
  if(t.eff==='req'){G.hacked++;G.nextNum++;floatText(t.x,t.y-16,'ACCESS GRANTED','#7dff9a');if(objDone())sayKey('obj');else sayKey('term');}
  else if(t.eff==='door'){const d=G.doors[0];if(d)openDoor(d);}
  else if(t.eff==='lasers'){for(const l of G.lasers)if(l.mode==='locked')l.off=true;floatText(t.x,t.y-16,'LASERS OFFLINE','#7dff9a');say('PIP',"Laser grid is down. Go grab what's behind it.");}
}
function hackFail(){
  const t=G.hack.term;t.cool=7;G.hack=null;sfx('deny');sayKey('fail');
  G.detect=Math.min(.95,G.detect+.2);alarm(P.x,P.y,320,2.4);G.shake=6;
}
function updHack(dt){
  const h=G.hack;h.t-=dt;h.flash=Math.max(0,h.flash-dt*3);
  if(h.t<=0){hackFail();return;}
  const q=h.q.splice(0);
  if(h.kind==='code'){
    for(const k of q){
      if(k.length!==1||k<'0'||k>'9')continue;
      h.buf+=k;sfx('type');
      if(h.buf.length>=3){
        if(h.buf===G.code.digits.join('')){const d=h.term;G.hack=null;sfx('ok');floatText(d.x,d.y-22,'CODE ACCEPTED','#7dff9a');openDoor(d);return;}
        h.buf='';h.flash=1;h.t-=3;sfx('deny');G.detect=Math.min(.95,G.detect+.05);
      }
    }
    return;
  }
  for(const k of q){
    if(h.kind==='seq'){
      if(k==='S')continue;
      if(k===h.seq[h.idx]){h.idx++;sfx('type');if(h.idx>=h.seq.length){hackDone();return;}}
      else{h.idx=0;h.t-=.8;h.flash=1;sfx('deny');}
    }else if(k==='S'){
      if(Math.abs(h.pos-h.zc)<h.zw/2){h.hits++;sfx('type');h.zc=rnd(.2,.8);h.zw*=.85;if(h.hits>=h.need){hackDone();return;}}
      else{h.hits=0;h.zw=.24;h.t-=1.2;h.flash=1;sfx('deny');}
    }
  }
  if(h.kind==='sync'){h.pos+=h.dir*dt*(1.15+G.n*.03);if(h.pos>=1){h.pos=1;h.dir=-1;}if(h.pos<=0){h.pos=0;h.dir=1;}}
}
function openDoor(d){
  d.open=true;grid[d.r][d.c]=0;sfx('door');G.shake=5;burst(d.x,d.y,'#ffffff',18,120);
  sayKey('door');
}
function nearestTerm(){
  let best=null,bd=34;
  for(const t of G.terms){if(t.done||t.cool>0)continue;const d=Math.hypot(P.x-t.x,P.y-t.y);if(d<bd){bd=d;best=t;}}
  return best;
}
function laserActive(b){
  if(b.mode==='locked')return !b.off;
  return ((G.t+b.ph)%b.per)/b.per<b.duty;
}

function updPlayer(dt){
  let ix=0,iy=0;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(keys.KeyW||keys.ArrowUp)iy-=1;if(keys.KeyS||keys.ArrowDown)iy+=1;
  let mag=0;
  if(ix||iy){const l=Math.hypot(ix,iy);ix/=l;iy/=l;mag=1;}
  else if(touch.x||touch.y){const l=Math.hypot(touch.x,touch.y);mag=Math.min(1,l);ix=touch.x/l;iy=touch.y/l;}
  const hacking=!!G.hack;
  if(hacking){ix=iy=0;mag=0;}
  const moving=mag>.1;
  if(moving){P.face=Math.atan2(iy,ix);}
  const want=keys.ShiftLeft||keys.ShiftRight||touch.sprint;
  P.sprinting=false;
  if(want&&moving&&P.stam>0&&!P.exhaust){P.sprinting=true;P.stam-=42*dt;if(P.stam<=0){P.stam=0;P.exhaust=true;}}
  else{P.stam=Math.min(P.maxStam,P.stam+(moving?14:28)*dt);if(P.exhaust&&P.stam>=25)P.exhaust=false;}
  P.dashCd=Math.max(0,P.dashCd-dt);P.jamCd=Math.max(0,P.jamCd-dt);P.decoyCd=Math.max(0,P.decoyCd-dt);
  if(hacking){req.dash=req.jam=req.decoy=false;}
  if(req.dash){req.dash=false;if(P.dashCd<=0){P.dashT=.17;P.dvx=moving?ix:Math.cos(P.face);P.dvy=moving?iy:Math.sin(P.face);P.dashCd=P.dashMax;sfx('dash');}else sfx('empty');}
  if(req.jam){req.jam=false;
    if(P.jamCd<=0&&P.jams>0){
      P.jams--;P.jamCd=1.2;sfx('jam');G.rings.push({x:P.x,y:P.y,t:0,c:'125,252,255'});G.detect=Math.max(0,G.detect-.3);
      for(const d of G.drones)if(Math.hypot(d.x-P.x,d.y-P.y)<175){d.stun=4;d.state='stun';d.path=[];burst(d.x,d.y,'#7dfcff',12,120);}
      for(const c of G.cams)if(Math.hypot(c.x-P.x,c.y-P.y)<200){c.stun=6;burst(c.x,c.y,'#7dfcff',10,100);}
    }else sfx('empty');}
  if(req.decoy){req.decoy=false;
    if(P.decoys>0&&P.decoyCd<=0){
      let dd=110;while(dd>26&&isWall(P.x+Math.cos(P.face)*dd,P.y+Math.sin(P.face)*dd))dd-=8;
      const x=P.x+Math.cos(P.face)*dd,y=P.y+Math.sin(P.face)*dd;
      P.decoys--;P.decoyCd=.8;G.decoys.push({x,y,t:5});sfx('decoy');G.rings.push({x,y,t:0,c:'255,200,60'});
      for(const d of G.drones){if(d.stun>0||d.state==='chase')continue;if(Math.hypot(d.x-x,d.y-y)<340){d.state='investigate';d.tx=x;d.ty=y;d.path=bfsPath(d.x,d.y,x,y);d.look=0;d.lookMax=3.6;}}
    }else sfx('empty');}
  let vx=0,vy=0;
  if(P.dashT>0){P.dashT-=dt;vx=P.dvx*580;vy=P.dvy*580;burst(P.x,P.y,'#9fffe8',1,20);}
  else{const sp=138*(P.sprinting?1.55:1)*(moving?Math.max(.5,mag):0);vx=ix*sp;vy=iy*sp;}
  P.loud=(P.sprinting&&!pk('silent'))||P.dashT>0;
  const dist=Math.hypot(vx,vy)*dt,steps=Math.max(1,Math.ceil(dist/4)),sx=vx*dt/steps,sy=vy*dt/steps;
  for(let i=0;i<steps;i++){
    if(!hitBox(P.x+sx,P.y,P.r))P.x+=sx;
    if(!hitBox(P.x,P.y+sy,P.r))P.y+=sy;
  }
  P.walk+=dist*.12;
  if(P.sprinting&&Math.random()<.4)burst(P.x,P.y+5,'rgba(255,255,255,.5)',1,25);
}

function updFx(dt){
  G.parts=G.parts.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;return p.life>0;});
  G.floats=G.floats.filter(f=>{f.life-=dt;f.y-=26*dt;return f.life>0;});
  G.rings=G.rings.filter(r=>{r.t+=dt;return r.t<.6;});
  G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt*1.5);
  for(const d of G.dust){d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.x<0)d.x=W;if(d.x>W)d.x=0;if(d.y<0)d.y=H;if(d.y>H)d.y=0;}
  if(G.radio){G.radio.t-=dt;if(G.radio.t<=0)G.radio=null;}
}

function update(dt){
  G.t+=dt;
  if(G.t<3&&G.t-dt<=0)sayKey('start');
  if(!G.lock){
    G.time-=dt;
    if(G.time<=0){G.time=0;triggerLock(11,false);}
    const sec=Math.ceil(G.time);if(G.time<10&&sec!==G.lastSec){G.lastSec=sec;sfx('tick');}
  }else{G.lockT-=dt;if(G.lockT<=0){caught('THE VAULT SEALED SHUT');return;}}
  updPlayer(dt);
  if(G.hack)updHack(dt);
  for(const t of G.terms){t.cool=Math.max(0,t.cool-dt);if(!t.seen&&Math.hypot(P.x-t.x,P.y-t.y)<80)t.seen=true;}
  for(const d of G.doors)d.cool=Math.max(0,(d.cool||0)-dt);
  if(req.act){req.act=false;
    if(G.hack){G.hack.term.cool=1;G.hack=null;}
    else{
      const t=nearestTerm();
      const d=G.doors.find(d=>!d.open&&d.needs==='code'&&(d.cool||0)<=0&&Math.hypot(P.x-d.x,P.y-d.y)<46);
      if(t&&(!d||Math.hypot(P.x-t.x,P.y-t.y)<=Math.hypot(P.x-d.x,P.y-d.y)))startHack(t);
      else{
        if(d){if(G.code.found.every(x=>x)){G.hack={term:d,kind:'code',buf:'',t:35,max:35,q:[],flash:0};sfx('ui');}else{sayKey('nocode');sfx('deny');floatText(d.x,d.y-22,'NEED '+G.code.found.filter(x=>!x).length+' MORE DIGITS','#ff5a64');}}
      }
    }}
  if(G.hack&&Math.hypot(P.x-G.hack.term.x,P.y-G.hack.term.y)>(G.hack.kind==='code'?58:40)){G.hack.term.cool=1;G.hack=null;}
  for(const d of G.drones){updDrone(d,dt);if(G.over)return;}
  for(const dc of G.decoys){dc.t-=dt;}
  G.decoys=G.decoys.filter(d=>d.t>0);
  // cameras
  let camRate=0;
  for(const c of G.cams){
    if(c.stun>0){c.stun-=dt;c.poly=null;c.seen=false;continue;}
    c.alertT=Math.max(0,c.alertT-dt);
    c.ang=c.base+Math.sin(G.t*.8+c.ph)*c.sw;
    computePoly(c);
    c.seen=canSee(c);
    if(c.seen){
      const dist=Math.hypot(P.x-c.x,P.y-c.y);
      camRate=Math.max(camRate,(.7+(1-dist/c.range)*.9)*(1+.05*(G.n-1)));
      if(c.alertT<=0){alarm(P.x,P.y,460,2.4);c.alertT=1.6;sayKey('cam');}
    }
  }
  // lasers
  for(const b of G.lasers){
    b.hitCd=Math.max(0,b.hitCd-dt);
    if(!laserActive(b)||b.hitCd>0||P.dashT>0)continue;
    let hitL=false;
    if(b.o==='h')hitL=Math.abs(P.y-b.y1)<P.r+2&&P.x>b.x1-2&&P.x<b.x2+2;
    else hitL=Math.abs(P.x-b.x1)<P.r+2&&P.y>b.y1-2&&P.y<b.y2+2;
    if(hitL){b.hitCd=1;G.detect=Math.min(.95,G.detect+.4*(pk('insul')?.5:1));sfx('zap');G.shake=7;G.flash=.3;alarm(P.x,P.y,420,2.6);sayKey('laser');burst(P.x,P.y,'#ff5a7a',16,150);}
  }
  // detection
  let mr=camRate*DF().det;
  for(const d of G.drones)if(d.seen&&d.stun<=0){
    const dist=Math.hypot(P.x-d.x,P.y-d.y);
    const r=(.85+(1-dist/d.range)*1.15)*(1+.06*(G.n-1))*DF().det*(P.sprinting?1.25:1)*Math.max(.3,1-.08*save.up.ghost-.12*pk('ghost'));
    if(r>mr)mr=r;
  }
  if(mr>0)G.detect+=mr*dt;else G.detect=Math.max(0,G.detect-.45*dt);
  if(G.detect>=1){caught('SPOTTED');return;}
  if(G.detect>.35){G.beepT-=dt;if(G.beepT<=0){sfx('beep');G.beepT=.55-G.detect*.45;}}
  // items
  G.comboT=Math.max(0,G.comboT-dt);if(G.comboT<=0)G.combo=0;
  for(const it of G.items){
    if(it.got)continue;
    if(Math.hypot(P.x-it.x,P.y-it.y)<17+14*pk('magnet')){
      it.got=true;
      if(it.t==='key'){G.keys[it.col]=true;sfx('key');burst(it.x,it.y,it.col,18,140);floatText(it.x,it.y-10,'KEYCARD','#fff');sayKey('key');continue;}
      if(it.t==='memo'){G.code.found[it.i]=true;sfx('key');burst(it.x,it.y,'#ffe9a8',16,130);floatText(it.x,it.y-10,'CODE DIGIT '+(it.i+1)+' = '+it.d,'#ffe9a8');sayKey('memo');continue;}
      G.got++;
      G.combo=G.comboT>0?Math.min(5,G.combo+1):1;G.comboT=3;
      const m=1+(G.combo-1)*.25,gain=Math.round(it.v*m*(1+.2*pk('greed')));
      G.score+=gain;G.heat=Math.min(.5,G.heat+(it.t==='core'?.2:it.t==='jack'?.1:it.t==='gem'?.03:.02)*(pk('cool')?.5:1));
      sfx(it.t==='jack'||it.t==='core'?'jack':it.t==='gem'?'gem':'coin');
      burst(it.x,it.y,it.t==='gem'?'#7dfcff':'#ffd24a',it.t==='jack'||it.t==='core'?30:12,it.t==='jack'||it.t==='core'?200:120);
      floatText(it.x,it.y-10,'+'+money(gain)+(G.combo>1?' x'+m.toFixed(2):''),it.t==='gem'?'#7dfcff':'#ffd24a');
      if(it.t==='jack'){G.shake=6;G.flash=.5;sayKey('jack');}
      if(it.t==='core'){G.coreTaken=true;G.shake=10;G.flash=.8;sayKey('jack');setTimeout(()=>{if(G&&!G.over)sayKey('lock');},1800);triggerLock(26,true);}
    }
  }
  // doors by key
  for(const d of G.doors){if(d.open||d.needs!=='key')continue;if(G.keys[d.col]&&Math.hypot(P.x-d.x,P.y-d.y)<30)openDoor(d);}
  // exit
  G.exitMsgT=Math.max(0,G.exitMsgT-dt);
  if(Math.hypot(P.x-(EX*T+T/2),P.y-(EY*T+T/2))<22){
    if(objDone())win();else if(G.exitMsgT<=0){G.exitMsgT=2.5;sfx('deny');floatText(EX*T+T/2,EY*T-12,'EXIT LOCKED','#ff5a64');}
  }
  updFx(dt);
}
function triggerLock(sec,core){
  if(G.lock)return;
  G.lock=true;G.lockT=sec;G.lockMax=sec;sfx('lock');G.shake=8;
  for(const d of G.drones)if(d.stun<=0){d.state='chase';d.path=[];d.rt=0;}
  if(!core)sayKey('lock');
}

function caught(why){
  if(G.over)return;
  G.over=true;G.why=why;mode='busted';G.bt=1.4;G.shake=14;G.flash=1;G.hack=null;sfx('busted');run.lives--;
}
function win(){
  if(G.over)return;
  G.over=true;mode='win';G.bt=.9;sfx('win');G.flash=.6;G.hack=null;
  const timeB=Math.floor(G.time)*10,ghost=G.spotted?0:Math.round(G.score*.25),total=G.score+timeB+ghost;
  G.sum={loot:G.score,timeB,ghost,total,got:G.got,all:G.items.filter(i=>i.t!=='key'&&i.t!=='memo').length};
  {const lf=G.sum.all?G.got/G.sum.all:1,pts=lf*50+(G.time/G.timeMax)*20+(G.spotted?0:30),rk=pts>=88?3:pts>=70?2:pts>=50?1:0;G.sum.rank=rk;G.sum.newBest=!(save.ranks[G.n]>=rk);if(!(save.ranks[G.n]>=rk))save.ranks[G.n]=rk;save.heists++;}
  save.bank+=total;run.total+=total;save.best=Math.max(save.best,run.total);save.maxLevel=Math.max(save.maxLevel,G.n+1);persist();
  burst(EX*T+T/2,EY*T+T/2,'#7dffa0',40,220);
}

function drawDrone(d){
  const th=G.th,hunter=d.type==='hunter';
  const col=d.stun>0?'120,130,150':d.state==='chase'?'255,50,50':d.state==='investigate'?'255,190,40':hunter?'255,140,40':th.dr;
  ctx.save();ctx.translate(d.x,d.y);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,10,11,4,0,0,7);ctx.fill();

  ctx.strokeStyle='rgba(200,220,255,.45)';ctx.lineWidth=1.6;
  for(let k=0;k<2;k++){ctx.beginPath();ctx.arc(0,0,15,rr0+k*Math.PI,rr0+k*Math.PI+1.1);ctx.stroke();}
  const bg=ctx.createRadialGradient(-3,-3,1,0,0,11);bg.addColorStop(0,'#3a4660');bg.addColorStop(1,'#141a28');

  ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11);}ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(-6,-7,8,3);
  if(d.type==='sentry'){ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.strokeRect(-5,-5,10,10);}

  const lg=ctx.createRadialGradient(6,0,0,6,0,6);lg.addColorStop(0,'#fff');lg.addColorStop(.4,'rgb('+col+')');lg.addColorStop(1,'rgba('+col+',0)');
  ctx.fillStyle=d.stun>0?'#555':lg;ctx.beginPath();ctx.arc(6,0,6,0,7);ctx.fill();

function drawItem(it){

function drawTerm(t){

    const gr=ctx.createRadialGradient(x,y,5,x,y,420);gr.addColorStop(0,'rgba(255,70,90,.4)');gr.addColorStop(1,'rgba(255,70,90,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,420,a-.25,a+.25);ctx.closePath();ctx.fill();
    ctx.fillStyle='#1b2230';ctx.strokeStyle='#ff505a';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill();ctx.stroke();
  });
  ctx.drawImage(vgc,0,0);
}

/* ---------- UI screens ---------- */
function panel(h){ov.innerHTML='<div class="panel">'+h+'</div>';ov.style.display='flex';}
function hide(){ov.style.display='none';ov.innerHTML='';}
function dialogHTML(lines){
  return '<div class="dlg">'+lines.map((l,i)=>{const c=CAST[l[0]]||CAST.PIP;
    return '<div class="line" style="animation-delay:'+(i*.75)+'s"><span class="av" style="background:'+c.col+';color:#05070c">'+c.ini+'</span><div><b style="color:'+c.col+'">'+l[0]+'</b><p>'+l[1]+'</p></div></div>';}).join('')+'</div>';
}
function diffHTML(){
  return '<div class="diffs">'+Object.keys(DIFFS).map(k=>'<button class="'+(save.diff===k?'sel':'')+'" onclick="UI.diff(\''+k+'\')">'+DIFFS[k].n+'</button>').join('')+'</div>';
}
function showTitle(){
  mode='title';G=null;
  let h='<h1>VAULT RUN</h1><div class="tag">A HEIST STORY IN EIGHT JOBS</div>'+
  '<div class="bank">Career Bank <b>'+money(save.bank)+'</b> &nbsp;·&nbsp; Best run <b>'+money(save.best)+'</b></div>'+diffHTML()+
  '<button onclick="UI.newGame()">NEW STORY</button>';
  if(save.maxLevel>1)h+='<button onclick="UI.cont()">CONTINUE — '+(save.maxLevel>8?'CONTRACT '+(save.maxLevel-8):'LEVEL '+save.maxLevel)+'</button>';
  h+='<button class="alt" onclick="UI.missions()">MISSIONS &amp; RANKS</button><button class="alt" onclick="UI.shop(\'title\')">BLACK MARKET</button>'+
  '<div class="help"><b>WASD / ARROWS</b> move · <b>SHIFT</b> sprint · <b>SPACE</b> dash · <b>E</b> jam · <b>Q</b> decoy · <b>F</b> hack<br><b>P</b> pause · <b>M</b> mute · touch controls appear on phones<br>'+
  'Dodge drones and cameras, solve the vault, keep your cool. Loot only counts if you escape.</div>';
  panel(h);
}
function objsPreview(n){
  const F=featFor(n),L=[];
  if(F.terms)L.push('Hack <b>'+F.terms+'</b> terminals'+(F.order?' <b>in numbered order</b>':''));
  if(F.vault)L.push(F.code?'Find <b>3 code memos</b>, crack the vault <b>keypad</b>':F.doorTerm?'Open the vault via its <b>terminal</b>':'Find the <b>keycard</b>, open the vault');
  for(const m of F.mods||[])L.push('<span style="color:#ff9a30">⚠ '+m.n+':</span> '+m.d);
  if(F.core)L.push('Steal the <b>Argus core</b> (triggers lockdown)');
  if(F.lasers||F.locked)L.push('Beware <b>lasers</b>'+(F.locked?' (some need a terminal to disable)':''));
  if(F.cams)L.push('<b>Cameras</b> sweep the area');
  if(F.hunters)L.push('<b>Hunter drones</b> patrol');
  L.push('Reach the <b>EXIT</b> before the clock runs out');
  return '<div class="objs">'+L.map(x=>'▸ '+x).join('<br>')+'</div>';
}
function showBrief(n){
  mode='title';G=null;
  const st=storyFor(n),th=THEMES[(n-1)%THEMES.length];
  let h='<h3>'+(n<=8?'HEIST '+n+' OF 8':'CONTRACT '+(n-8))+'</h3><h2>'+th.name.toUpperCase()+'</h2>'+dialogHTML(st.brief)+objsPreview(n);
  if(n===2)h+='<div class="bank"><b>NEW GADGET:</b> Decoy [Q]</div>';
  if(n===3)h+='<div class="bank"><b>NEW:</b> Hack terminals [F] · lasers · cameras</div>';
  h+='<button onclick="UI.go('+n+')">BEGIN HEIST ▶</button><button class="alt" onclick="UI.shop(\'brief'+n+'\')">BLACK MARKET</button>';
  panel(h);
}
function shopHTML(back){
  let h='<h2>BLACK MARKET</h2><div class="bank">Career Bank <b>'+money(save.bank)+'</b></div><div class="shop">';
  for(const u of UPS){
    const lv=save.up[u.k],maxed=lv>=u.max,cost=upCost(u);
    h+='<div class="row"><div class="nm"><b>'+u.name+'</b><small>'+u.desc+'</small></div><div class="pips">'+'●'.repeat(lv)+'○'.repeat(u.max-lv)+'</div>'+
    (maxed?'<span class="mx">MAX</span>':'<button '+(save.bank<cost?'disabled':'')+' onclick="UI.buy(\''+u.k+'\',\''+back+'\')">'+money(cost)+'</button>')+'</div>';
  }
  h+='</div><button onclick="UI.shopBack(\''+back+'\')">BACK</button>';
  return h;
}
function showSummary(){
  const s=G.sum,st=G.story;
  panel('<h2>CLEAN GETAWAY</h2><div class="tbl">'+
  '<div><span>Loot grabbed ('+s.got+'/'+s.all+')</span><b>'+money(s.loot)+'</b></div>'+
  '<div><span>Time bonus</span><b>'+money(s.timeB)+'</b></div>'+
  '<div><span>Ghost bonus (never chased)</span><b>'+(s.ghost?money(s.ghost):'—')+'</b></div>'+
  '<div><span>Rank</span><b style="color:'+RANKC[s.rank]+';font-size:1.3em">'+RANKN[s.rank]+(s.newBest?' (new best)':'')+'</b></div>'+
  '<div class="tot"><span>BANKED</span><b>'+money(s.total)+'</b></div></div>'+
  '<div class="bank">Career Bank <b>'+money(save.bank)+'</b> · Run total <b>'+money(run.total)+'</b></div>'+
  (st.after&&st.after.length?dialogHTML(st.after):'')+
  (G.n===8?'<button onclick="UI.epilogue()">CONTINUE ▶</button>':'<button onclick="UI.next()">NEXT: '+(G.n+1<=8?'HEIST '+(G.n+1):'CONTRACT '+(G.n+1-8))+' ▶</button>')+
  '<button class="alt" onclick="UI.shop(\'sum\')">BLACK MARKET</button>');
}
function showBusted(){
  if(run.lives>0){
    panel('<h2 class="bad">BUSTED</h2><div class="bank">'+G.why+'<br>Loot lost: <b>'+money(G.score)+'</b> · Lives left: <b>'+'♥'.repeat(run.lives)+'</b></div>'+
    '<button onclick="UI.retry()">RETRY '+levelTitle(G.n)+'</button><button class="alt" onclick="UI.title()">QUIT TO TITLE</button>');
  }else{
    panel('<h2 class="bad">GAME OVER</h2><div class="bank">'+G.why+'<br>Run total banked: <b>'+money(run.total)+'</b><br>Career Bank <b>'+money(save.bank)+'</b> · Best run <b>'+money(save.best)+'</b></div>'+
    '<button onclick="UI.newGame()">NEW STORY</button>'+(save.maxLevel>1?'<button class="alt" onclick="UI.cont()">CONTINUE — '+levelTitle(save.maxLevel)+'</button>':'')+
    '<button class="alt" onclick="UI.shop(\'title\')">BLACK MARKET</button>');
  }
}
function pauseGame(){
  if(mode!=='play'&&mode!=='intro')return;
  prevMode=mode;mode='pause';
  panel('<h2>PAUSED</h2><div class="bank">'+perkText()+'</div><button onclick="UI.resume()">RESUME</button><button class="alt" onclick="UI.title()">QUIT TO TITLE</button>');
}
let shopCtx=null;
const PERKS=[
{k:'silent',n:'Soft Soles',d:'Sprinting makes no noise.',max:1},
{k:'magnet',n:'Sticky Fingers',d:'Bigger loot pickup radius.',max:3},
{k:'stam',n:'Lungs of Iron',d:'+30 max stamina.',max:4},
{k:'jam',n:'Spare Jammer',d:'+1 jam charge each heist.',max:3},
{k:'decoy',n:'Spare Decoy',d:'+1 decoy each heist.',max:3},
{k:'time',n:'Extra Minute',d:'+8s on the clock.',max:4},
{k:'phase',n:'Phase Coils',d:'Dash cooldown -1s.',max:2},
{k:'ghost',n:'Shadow Cloak',d:'-12% detection speed.',max:3},
{k:'greed',n:'Fence Contacts',d:'+20% loot value.',max:5},
{k:'insul',n:'Insulated Suit',d:'Laser hits add half the alert.',max:1},
{k:'cool',n:'Cool Head',d:'Looting adds half the heat.',max:1},
{k:'life',n:'Second Wind',d:'+1 life right now.',max:99}];
function resetRun(){run.lives=DF().lives;run.total=0;run.perks={};}
function perkText(){
  const a=PERKS.filter(p=>p.k!=='life'&&pk(p.k)>0).map(p=>p.n+(pk(p.k)>1?' ×'+pk(p.k):''));
  return a.length?'Run perks: <b>'+a.join(', ')+'</b>':'';
}
function showPerks(){
  mode='title';
  const pool=shuffle(PERKS.filter(p=>pk(p.k)<p.max)).slice(0,3);
  let h='<h3>CHOOSE A PERK FOR THIS RUN</h3><h2>THE FENCE\'S OFFER</h2><div class="bank">Perks last until your run ends (game over).<br>'+perkText()+'</div>';
  for(const p of pool)h+='<button onclick="UI.perk(\''+p.k+'\')"><b>'+p.n+'</b>'+(pk(p.k)?' (have '+pk(p.k)+')':'')+'<br><small style="font-weight:normal;color:#9fb0d0">'+p.d+'</small></button>';
  panel(h);
}
function showMissions(){
  const top=Math.max(save.maxLevel,1);
  let h='<h2>MISSIONS</h2><div class="bank">Replay any unlocked heist to improve your rank.<br>Heists completed: <b>'+save.heists+'</b></div><div class="shop">';
  const from=Math.max(1,top-39);
  for(let n=top;n>=from;n--){
    const th=THEMES[(n-1)%THEMES.length],rk=save.ranks[n],mods=modsFor(n).map(m=>m.n).join(' + ');
    h+='<div class="row"><div class="nm"><b>'+(n<=8?'HEIST '+n:'CONTRACT '+(n-8))+' — '+th.name+'</b><small>'+(mods||'&nbsp;')+'</small></div><div class="pips" style="color:'+(rk===undefined?'#556':RANKC[rk])+';font-size:1.3em;font-weight:bold">'+(rk===undefined?'—':RANKN[rk])+'</div><button onclick="UI.play('+n+')">PLAY</button></div>';
  }
  h+='</div><button onclick="UI.title()">BACK</button>';
  panel(h);
}
const UI={
  newGame(){ainit();sfx('ui');resetRun();showBrief(1);},
  cont(){ainit();sfx('ui');resetRun();showBrief(save.maxLevel);},
  go(n){sfx('ui');startLevel(n);},
  next(){sfx('ui');run.level=G.n+1;run.pending=G.n+1;showPerks();},
  retry(){sfx('ui');startLevel(G.n);},
  title(){sfx('ui');showTitle();},
  diff(k){sfx('ui');save.diff=k;persist();showTitle();},
  shop(back){ainit();sfx('ui');if(back==='sum')shopCtx={back,n:G.n};else if(back.indexOf('brief')===0)shopCtx={back,n:+back.slice(5)};else shopCtx={back};panel(shopHTML(back));},
  buy(k,back){const u=UPS.find(x=>x.k===k),c=upCost(u);if(save.up[k]>=u.max||save.bank<c)return;save.bank-=c;save.up[k]++;persist();sfx('gem');panel(shopHTML(back));},
  shopBack(back){sfx('ui');if(back==='sum'){showSummary();}else if(back.indexOf('brief')===0)showBrief(+back.slice(5));else showTitle();},
  epilogue(){
    sfx('ui');
    panel('<h3>EPILOGUE</h3><h2>THE LAST VAULT</h2>'+dialogHTML(EPILOGUE)+'<div class="bank">You cleared all eight jobs.<br>Career Bank <b>'+money(save.bank)+'</b></div><button onclick="UI.next()">CONTRACT MODE ▶</button><button class="alt" onclick="UI.title()">TITLE</button>');
  },
  resume(){hide();mode=prevMode;},
  missions(){sfx('ui');showMissions();},
  play(n){ainit();sfx('ui');resetRun();showBrief(n);},
  perk(k){
    sfx('gem');run.perks[k]=(run.perks[k]||0)+1;if(k==='life')run.lives++;
    showBrief(run.pending);
  }
};
window.UI=UI;

/* ---------- input ---------- */
const HK={ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R'};
addEventListener('keydown',e=>{
  ainit();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  keys[e.code]=true;
  if(mode==='play'&&G&&G.hack&&G.hack.kind==='code'){const m=/^(Digit|Numpad)(\d)$/.exec(e.code);if(m)G.hack.q.push(m[2]);}
  if(mode==='play'&&G&&G.hack){
    if(HK[e.code])G.hack.q.push(HK[e.code]);
    if(e.code==='Space')G.hack.q.push('S');
  }else if(mode==='play'){
    if(e.code==='Space')req.dash=true;
    if(e.code==='KeyE'||e.code==='KeyJ')req.jam=true;
    if(e.code==='KeyQ')req.decoy=true;
  }
  if(mode==='play'&&e.code==='KeyF')req.act=true;
  if(e.code==='KeyP'||e.code==='Escape'){if(mode==='pause')UI.resume();else pauseGame();}
  if(e.code==='KeyM')setMute(!muted);
  if(mode==='intro'&&(e.code==='Space'||e.code==='Enter'))G.introT=Math.min(G.introT,.3);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;touch.sprint=false;touch.x=touch.y=0;if(mode==='play')pauseGame();});
addEventListener('pointerdown',ainit);
cv.addEventListener('pointerdown',e=>{
  if(mode!=='play'||!G||!G.hack||G.hack.kind!=='code'||!G.hack.keys)return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  for(const k of G.hack.keys)if(x>=k.x&&x<=k.x+k.w&&y>=k.y&&y<=k.y+k.h){G.hack.q.push(k.d);break;}
});
if(('ontouchstart' in window)||(navigator.maxTouchPoints>0)){
  $('touch').style.display='block';
  const joy=$('joy'),knob=$('knob');let jid=null;
  const jmove=t=>{
    const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width/2;
    let dx=(t.clientX-cx)/rad,dy=(t.clientY-cy)/rad;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
    touch.x=Math.abs(dx)<.15?0:dx;touch.y=Math.abs(dy)<.15?0:dy;knob.style.transform='translate('+dx*40+'%,'+dy*40+'%)';
    // flick detection for hacking
    const m=Math.hypot(dx,dy);
    if(m>.7){const d=Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U');if(touch.dir!==d){touch.dir=d;if(mode==='play'&&G&&G.hack)G.hack.q.push(d);}}
    else if(m<.35)touch.dir=null;
  };
  joy.addEventListener('touchstart',e=>{e.preventDefault();ainit();jid=e.changedTouches[0].identifier;jmove(e.changedTouches[0]);},{passive:false});
  joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===jid)jmove(t);},{passive:false});
  const jend=e=>{for(const t of e.changedTouches)if(t.identifier===jid){jid=null;touch.x=touch.y=0;touch.dir=null;knob.style.transform='';}};
  joy.addEventListener('touchend',jend);joy.addEventListener('touchcancel',jend);
  const hold=(id,on,off)=>{const b=$(id);b.addEventListener('touchstart',e=>{e.preventDefault();ainit();on();},{passive:false});if(off){b.addEventListener('touchend',off);b.addEventListener('touchcancel',off);}};
  hold('bS',()=>{touch.sprint=true;},()=>{touch.sprint=false;});
  hold('bD',()=>{if(mode!=='play')return;if(G&&G.hack)G.hack.q.push('S');else req.dash=true;});
  hold('bJ',()=>{if(mode==='play')req.jam=true;});
  hold('bQ',()=>{if(mode==='play')req.decoy=true;});
  hold('bF',()=>{if(mode==='play')req.act=true;});
}

/* ---------- main loop ---------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!G){drawTitleBG();return;}
  if(mode==='intro'){G.introT-=dt;G.t+=dt;updFx(dt);if(G.introT<=0)mode='play';}
  else if(mode==='play')update(dt);
  else if(mode==='busted'){G.bt-=dt;G.t+=dt;updFx(dt);if(G.bt<=0){mode='over';showBusted();}}
  else if(mode==='win'){G.bt-=dt;G.t+=dt;updFx(dt);if(G.bt<=0){mode='over';showSummary();}}
  if(G)draw();
  musicTick();
}
showTitle();
requestAnimationFrame(frame);
</script>
